<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>WISS Stundenplan</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; src: url("fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; }
  :root { --bg: #ffffff; --ink: #16141d; --muted: #6e6a76; --line: #e6e1d8; --track: #efebe4; --accent: #e8344e; color-scheme: light; }
  :root[data-mode=dark] { --bg: #1a1820; --ink: #f3f1f6; --muted: #9d98a8; --line: #2e2b36; --track: #2a2731; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.3 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default; }
  .card { position: relative; height: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 16px 14px 18px; border: 1px solid var(--line); }
  .card::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 14px; width: 4px; border-radius: 0 3px 3px 0; background: var(--c, var(--accent)); }
  .main { flex: 1; min-width: 0; }
  .k { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .k i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .k i.next { background: #ffc857; }
  .t { font: 700 16px/1.2 "Bricolage Grotesque", "Geist", system-ui, sans-serif; letter-spacing: -.02em; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .room { flex: none; text-align: right; padding-left: 14px; border-left: 1px solid var(--line); min-width: 78px; }
  .room small { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .09em; color: var(--muted); }
  .room b { display: block; font: 800 26px/1.05 "Bricolage Grotesque", "Geist", system-ui, sans-serif; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .room b span { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0; margin-right: 1px; }
  .prog { position: absolute; left: 18px; right: 16px; bottom: 6px; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 2px; }
  .empty { color: var(--muted); font-size: 13px; }
  .x { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: var(--muted); font: 600 13px/1 system-ui, sans-serif; cursor: pointer; opacity: 0; transition: opacity .15s; }
  body:hover .x { opacity: 1; }
  .x:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="card" id="card" data-tauri-drag-region></div>
<button class="x" id="x" type="button" aria-label="Schliessen">×</button>
<script>
(() => {
  const T = window.__TAURI__;
  const card = document.getElementById('card');
  let data = null;
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // same light/dark and accent colour as the app (shared local storage)
  function look() {
    let L = {};
    try { L = JSON.parse(localStorage.getItem('wissLook') || '{}') || {}; } catch (e) {}
    const mode = L.mode === 'dark' || L.mode === 'light' ? L.mode : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.mode = mode;
    const acc = (data && data.accent) || L.acc;
    if (acc) document.documentElement.style.setProperty('--accent', acc);
  }
  function draw() {
    look();
    const en = data && data.lang === 'en';
    document.getElementById('x').setAttribute('aria-label', en ? 'Close' : 'Schliessen');
    const now = Date.now();
    const list = (data && data.lessons) || [];
    const l = list.find((x) => x.e > now);
    if (!l) { card.innerHTML = `<div class="empty" data-tauri-drag-region>${en ? 'No more lessons' : 'Keine Lektionen mehr'}</div>`; return; }
    const on = l.s <= now;
    const mins = Math.max(1, Math.round(((on ? l.e : l.s) - now) / 60000));
    const dur = mins >= 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${mins} min`;
    const soon = !on && l.s - now < 12 * 3600e3;
    const kick = on ? (en ? `Now · ${dur} left` : `Jetzt · noch ${dur}`)
      : soon ? (en ? `Next · in ${dur}` : `Als Nächstes · in ${dur}`) : `${l.dl} · ${l.sh}`;
    const r = l.r || '–', cut = r.indexOf('-');
    const [pre, num] = cut > 0 && cut < 4 ? [r.slice(0, cut + 1), r.slice(cut + 1)] : ['', r];
    const after = list[list.indexOf(l) + 1];
    const meta = `${esc(l.sh)}–${esc(l.eh)}${l.p ? ' · ' + esc(l.p) : ''}`;
    const prog = on ? Math.min(100, Math.max(0, ((now - l.s) / (l.e - l.s)) * 100)) : 0;
    card.style.setProperty('--c', l.c || '');
    card.innerHTML = `
      <div class="main" data-tauri-drag-region>
        <div class="k" data-tauri-drag-region><i class="${on ? '' : 'next'}"></i>${esc(kick)}</div>
        <div class="t" data-tauri-drag-region title="${esc(l.t)}">${esc(l.t)}</div>
        <div class="m" data-tauri-drag-region>${meta}${on && after && after.s - l.e < 3 * 3600e3 ? ` · ${en ? 'then' : 'danach'} ${esc(after.sh)}` : ''}</div>
      </div>
      <div class="room" data-tauri-drag-region><small data-tauri-drag-region>${en ? 'ROOM' : 'RAUM'}</small><b data-tauri-drag-region>${pre ? `<span>${esc(pre)}</span>` : ''}${esc(num)}</b></div>
      ${on ? `<div class="prog"><i style="width:${prog.toFixed(1)}%"></i></div>` : ''}`;
  }
  T.core.invoke('mini_data').then((d) => { data = d; draw(); });
  T.event.listen('widget', (e) => { data = e.payload; draw(); });
  addEventListener('storage', draw);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  document.getElementById('x').addEventListener('click', () => T.core.invoke('mini_close'));
  setInterval(draw, 20000);
})();
</script>
</body>
</html>
